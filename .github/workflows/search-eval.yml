name: Search evaluation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stylegallery-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search:
    name: Search v3 contracts and retrieval gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache the hybrid search embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/stylegallery/models
          key: stylegallery-embedding-${{ hashFiles('scripts/agent-native/v2/search-embeddings.mjs') }}

      - name: Document embeddings are current (text hashes, then every vector re-embedded)
        run: node scripts/agent-native/v2/generate-search-embeddings.mjs --check --vectors

      - name: Search contracts
        run: node --test scripts/test-stylegallery-search.mjs

      - name: Setup command contracts
        run: node --test scripts/test-stylegallery-setup.mjs

      - name: Audit command contracts (ledger schema, good and bad fixtures)
        run: node --test scripts/test-stylegallery-audit.mjs

      - name: Retrieval evaluation gate, lexical mode (must-pass top 5, Hit@5 and nDCG@5 within 0.02 of eval/search/scores.json)
        run: node scripts/search-eval.mjs --gate --mode lexical

      - name: Retrieval evaluation gate, hybrid mode (also no model fallback, held-out and mismatch Hit@5 at least lexical)
        run: node scripts/search-eval.mjs --gate --mode hybrid
