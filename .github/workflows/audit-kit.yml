name: Audit kit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-kit:
    name: Audit CLI, MCP, negative controls, and showcase parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run validate:skill-frontmatter
      - run: bun run test:skill-frontmatter
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:audit
      - run: bun run test:audit:self
      - run: bun run test:audit:realsites
      - run: bun run test:showcase:self
      - run: bun run test:audit:parity
